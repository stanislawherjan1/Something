name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs-impact:
    # "Docs before main" (CLAUDE.md): changes landing on main that touch shipped
    # code must update the affected docs or declare `Docs-Impact: none — <reason>`.
    # On a PR this blocks the merge; on a direct push to main it can only flag it
    # after the fact — the blocking gate for direct pushes is the local
    # PreToolUse hook (scripts/hooks/docs-before-main.sh).
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check docs impact
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: scripts/check-docs-impact.sh "$BASE" "$HEAD_SHA"

  workspace-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ide-template/workspace-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # matches the workspace container (Dockerfile: nodesource 22.x)
          cache: npm
          cache-dependency-path: ide-template/workspace-api/package-lock.json
      - run: npm ci
      - run: npm test
      # Recurrence engine shared by reminder-mcp and the reminder monitor; no deps.
      - run: node ../apps/reminder-mcp/recur.test.mjs
      - run: node ../apps/reminder-mcp/room-target.test.mjs
      # The planner's one-step plan swap, against the real server over stdio.
      - run: npm ci --no-audit --no-fund --prefix ../apps/reminder-mcp
      - run: node ../apps/reminder-mcp/replace-plan.test.mjs
      # Guard tests: memory read isolation and reminder settling. Both import
      # only node builtins and lib files, so they need no install of their own.
      - run: node ../scripts/test-memory-read.mjs
      - run: node ../scripts/test-reminder-settle.mjs

  syntax:
    # Parse-only checks over everything the Docker build or a deploy runs but
    # no test imports: a typo in an MCP entry point, a route module, a shell
    # script or a setuid wrapper otherwise shows up on the server, minutes into
    # a build or at the first request. Each check costs seconds and needs no
    # install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check on MCP entry points and workspace-api routes
        run: |
          for f in ide-template/apps/*/index.js ide-template/workspace-api/routes/*.js; do
            node --check "$f" || { echo "::error file=$f::does not parse"; exit 1; }
          done
      - name: bash -n on deploy, bot, installer and helper scripts
        run: |
          for f in ide-template/*.sh ide-template/bot/*.sh install.sh update.sh bin/*.sh scripts/*.sh; do
            bash -n "$f" || { echo "::error file=$f::does not parse"; exit 1; }
          done
      # The wrappers include "env-guard.h" from their own directory and Linux
      # headers (sys/prctl.h), which the ubuntu runner has; -fsyntax-only
      # parses and type-checks without producing a binary.
      - name: gcc -fsyntax-only on the setuid wrappers
        run: |
          for f in ide-template/setuid-wrappers/*.c; do
            gcc -fsyntax-only -Wall -I ide-template/setuid-wrappers "$f" || { echo "::error file=$f::does not compile"; exit 1; }
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ide-template/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20          # matches Dockerfile.frontend (node:20-slim)
          cache: npm
          cache-dependency-path: ide-template/frontend/package-lock.json
      - run: npm ci
      # Lint is not gated yet: `eslint .` currently reports 68 errors. Add
      # `npm run lint` here once that backlog is cleared.
      - run: npm run build
