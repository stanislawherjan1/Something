resolver 127.0.0.11 valid=10s ipv6=off;

# Limit upload size (large files go through rclone/Drive, not the IDE proxy)
client_max_body_size 50m;

# All `proxy_pass` directives use a `set $var` pattern (instead of a bare URL)
# so nginx re-resolves the upstream hostname through Docker's embedded DNS on
# every request. With a literal `proxy_pass http://code-server:3001;` nginx
# resolves once at startup and pins the IP — when the code-server container is
# recreated and lands on a new IP (every redeploy), all requests 502 with
# `connect() failed (111: Connection refused)` until frontend is restarted.
# The variable form sidesteps that entirely.

# ─── Internal auth_request subrequest ─────────────────────────────────────────
# This block handles the internal verification call from auth_request.
# NOT publicly accessible.
server {
    listen 3002;
    location /auth/ {
        set $auth_upstream http://auth-service:3002;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
}

# ─── Port 3000: React SPA (login, whitelist check) ────────────────────────────
# `try_files $uri /index.html` deliberately omits the `$uri/` probe between
# them. `$uri/` would match the `/integrations/` directory we ship for the
# per-integration logo SVGs — nginx then emits a 301 to add the trailing
# slash, using `$server_name:$server_port` for the Location header. Because
# this server is on port 3000 (internal only — Caddy is the public 443
# endpoint), the redirect points at an unreachable URL and the browser
# stalls ~16 s waiting for the dead port before falling back. Stripping
# the `$uri/` probe makes /integrations fall straight through to
# /index.html (SPA fallback) while keeping /integrations/openai.svg etc.
# served as files. absolute_redirect/port_in_redirect off is defence in
# depth: if some other directory clash sneaks in, we won't leak port 3000
# into a public redirect.
server {
    listen 3000;
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri /index.html;
    }
}

# ─── Port 3001: Code-server proxy (Supabase JWT session gated) ────────────────
server {
    listen 3001;
    absolute_redirect off;

    # Auth endpoint — public, no verification (frontend calls this with JWT)
    location /auth/ {
        set $auth_upstream http://auth-service:3002;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Public branding endpoints (login page reads pre-auth) ──────────────
    # Only GETs are exposed; PUT/POST/DELETE return 403 here, the auth-gated
    # /api/ block handles those.
    location = /api/branding {
        limit_except GET { deny all; }
        set $api_upstream http://code-server:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/branding/avatar {
        limit_except GET { deny all; }
        set $api_upstream http://code-server:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/branding/logo {
        limit_except GET { deny all; }
        set $api_upstream http://code-server:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Public branding assets (login page + chat header need these pre/post-auth) ──
    # Without these, /bot.png and /logo.png fall through to the catch-all
    # /location below (auth_request → 302 to /app/) and the LoginPage shows
    # broken images. The files live in /usr/share/nginx/html (same volume the
    # SPA serves from on :3000); we just expose them on :3001 too without an
    # auth gate. Cache for 5 min — they only change on redeploy.
    #
    # `workspace-logo` is the neutral fallback shipped with every deploy
    # (BrandedImage swaps to it on a 404). The other names are per-client
    # overrides copied from `clients/<x>/overrides/public/`.
    location ~ ^/(bot|logo|icon|favicon|workspace-logo)\.(png|svg|jpe?g)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }
    location /avatars/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }
    location /integrations/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # ─── Workspace API (chat + future hot-config endpoints) ──────────────────
    # Docs Comments noVNC bridge — both static assets (vnc.html, core/*) AND
    # the WebSocket upgrade to websockify go through here. Match the whole
    # /vnc subtree so we can keep Upgrade-header handling that the general
    # /api/ block strips (Connection ''). Long timeouts because a login
    # session can sit idle while the user reads a 2FA prompt.
    location /api/integrations/docs-comments/vnc {
        auth_request /auth/verify;
        auth_request_set $ide_user $upstream_http_x_ide_user;
        error_page 401 = @unauthorized;

        set $api_upstream http://code-server:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-IDE-User $ide_user;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Behind auth_request — only authenticated users can reach workspace-api.
    # workspace-api itself has no auth check, so this gate is load-bearing.
    # SSE stream from /api/chat needs proxy_buffering off + long read timeout.
    location /api/ {
        auth_request /auth/verify;
        auth_request_set $ide_user $upstream_http_x_ide_user;
        # /api/* is a JSON API — return a clean 401 so the frontend's global
        # fetch interceptor (lib/authFetch.js) can dispatch `auth:expired` and
        # flip the UI to LoginPage. The old 302-to-/app/ behaviour caused
        # fetch to auto-follow the redirect, hand the SPA's HTML back as the
        # response body, and crash JSON.parse with "did not match the expected
        # pattern" in whichever component made the call. Browser navigation
        # (the catch-all `location /` below) still uses @unauthorized → 302.
        error_page 401 = @api_unauthorized;

        set $api_upstream http://code-server:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward the verified user email so /api/team can authorize admins.
        # Strip any client-provided X-IDE-User to prevent header spoofing.
        proxy_set_header X-IDE-User $ide_user;

        # Streaming: don't buffer SSE chunks
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # claude turns can take up to a couple minutes; bump read timeout
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Bot health — behind auth, proxied to health server
    location = /bot/health {
        auth_request /auth/verify;
        set $health_upstream http://code-server:9090/;
        proxy_pass $health_upstream;
    }

    # Everything else — requires valid session cookie (verified by auth-service)
    location / {
        auth_request /auth/verify;
        auth_request_set $ide_user $upstream_http_x_ide_user;

        # On auth failure → 401
        error_page 401 = @unauthorized;

        set $code_upstream http://code-server:8080;
        proxy_pass $code_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-IDE-User $ide_user;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_http_version 1.1;

        # NOTE: Permissions-Policy for clipboard is set by Caddy (outer proxy).
        # Do NOT add it here — duplicate headers conflict and Chrome uses the most restrictive one.
    }

    # Internal auth_request subrequest
    location = /auth/verify {
        internal;
        set $verify_upstream http://auth-service:3002/auth/verify;
        proxy_pass $verify_upstream;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location @unauthorized {
        return 302 /app/;
    }

    location @api_unauthorized {
        default_type application/json;
        return 401 '{"error":"session_expired"}';
    }
}
